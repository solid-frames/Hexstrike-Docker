name: Lint

on:
  push:
    paths:
      - "hexstrike/Dockerfile"
      - "hexstrike/setup-bridge.sh"
      - ".hadolint.yaml"
      - ".github/workflows/lint.yml"
  pull_request:
    paths:
      - "hexstrike/Dockerfile"
      - "hexstrike/setup-bridge.sh"
      - ".hadolint.yaml"
      - ".github/workflows/lint.yml"

jobs:
  hadolint:
    name: Dockerfile (hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: hexstrike/Dockerfile
          config: .hadolint.yaml

  shellcheck:
    name: Shell scripts (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./hexstrike
